<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Search</title>
    <script type="module" crossorigin src="/goit-js-hw-11/index.js"></script>
    <link rel="modulepreload" crossorigin href="/goit-js-hw-11/assets/vendor-5ObWk2rO.js">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-11/assets/vendor-DumFYO8Z.css">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-11/assets/index-Dzyb6x_y.css">
  </head>
  <body>
    <header class="header">
      <form class="search-form" autocomplete="off">
        <label class="search-label">
          <input
            class="search-input"
            type="text"
            name="query"
            placeholder="Search images..."
          />
        </label>
        <button class="search-btn" type="submit">Search</button>
      </form>
      <p class="loading-text" id="loadingText">
        Loading images, please wait...
      </p>
    </header>

    <main class="container">
      <div class="loader-backdrop is-hidden" aria-hidden="true">
        <div class="loader" aria-label="Loading"></div>
      </div>

      <ul class="gallery"></ul>
    </main>

  </body>
</html>
